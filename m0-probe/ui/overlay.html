<!doctype html>
<html>
<head><meta charset="utf-8"><title>overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  .panel { margin: 12px; padding: 12px; border-radius: 10px; background: rgba(28,30,30,.97);
    border: 1px solid #00FF00; color: #eee; font: 13px/1.5 system-ui; }
  input { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 6px;
    background: #111; color: #eee; border: 1px solid #444; border-radius: 6px; }
</style>
</head>
<body>
  <div class="panel">
    <b style="color:#00FF00">E4 overlay</b>
    <div>Must paint above the tab webview. Focus must stay here while typing.</div>
    <input id="i" placeholder="type here without losing focus">
    <div style="margin-top:6px;opacity:.7">Esc closes (handled by the app in the real build).</div>
  </div>
  <script>
    document.getElementById("i").focus();
    console.log("[overlay] ready");
  </script>
</body>
</html>
