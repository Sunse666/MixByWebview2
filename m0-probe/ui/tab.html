<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tab</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd;
    font: 14px/1.6 system-ui, sans-serif; }
  h1 { font-size: 16px; color: #00FF00; }
  .box { border: 1px solid #333; border-radius: 8px; padding: 10px; margin: 10px 0; }
  input, [contenteditable] { background: #1c1c1c; color: #eee; border: 1px solid #444;
    border-radius: 6px; padding: 6px; min-height: 24px; display: block; width: 100%; box-sizing: border-box; }
  .tall { height: 1200px; background: linear-gradient(#151515, #202020); }
</style>
</head>
<body>
  <h1 id="h">tab webview</h1>
  <div class="box">
    <div>1. Type here (E2 focus / E6 IME):</div>
    <input id="plain" placeholder="plain input">
    <div style="margin-top:8px">2. contenteditable (IME candidate window position):</div>
    <div contenteditable="true" id="ce"></div>
  </div>
  <div class="box">
    <div>3. File input (E5 upload):</div>
    <input type="file" id="file">
    <div style="margin-top:8px">4. Download link (E5 on_download):</div>
    <a href="data:text/plain;charset=utf-8,hello%20from%20mix%20probe"
       download="probe.txt" id="dl">download probe.txt</a>
  </div>
  <div class="box"><div>5. Title sync: press the button</div>
    <button id="tt">change document.title</button></div>
  <div class="tall"></div>
  <script>
    // App URLs drop the query string, so the probe tag rides in the fragment.
    const q = location.hash.replace("#", "") || new URLSearchParams(location.search).get("q") || "?";
    document.getElementById("h").textContent = "tab webview " + q;
    document.getElementById("tt").onclick = () => {
      document.title = "tab " + q + " " + Date.now();
    };
    const vw = window.innerWidth, vh = window.innerHeight;
    console.log("[tab] viewport", vw, vh, "dpr", window.devicePixelRatio);
  </script>
</body>
</html>
