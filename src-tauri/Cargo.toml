[package]
name = "mix"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-runtime = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true