[package]
name = "mix"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: F12 must work in the packaged release, not only in debug builds.
tauri = { version = "2", features = ["unstable", "tray-icon", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-runtime = "2"
zip = "4.2.0"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
parking_lot = "0.12.5"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "cookies", "form"] }
md-5 = "0.10.6"
arboard = "3.7.0"
winreg = "0.56.0"
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
raw-window-handle = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Gate on the lints rustc can enforce locally; clippy is not installed for the
# gnu toolchain, so this is the practical net for dead parameters and imports.
[lints.rust]
unused_variables = "deny"
unused_imports = "deny"
unused_mut = "deny"
