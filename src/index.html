<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="titlebar">
    <div id="drag">
      <div class="brand"></div>
      <div id="tabs"></div>
      <button class="icon" id="tab-new" title="New tab" data-i18n-title="New tab">+</button>
      <!-- Every open tab as one list, which is what a strip too narrow to read needs. -->
      <button class="icon" id="tab-list" title="All tabs" data-i18n-title="All tabs">≣</button>
    </div>
    <div class="win-buttons">
      <button class="win" data-window="min" title="Minimize" data-i18n-title="Minimize">-</button>
      <button class="win" data-window="max" title="Maximize" data-i18n-title="Maximize">O</button>
      <button class="win danger" data-window="close" title="Close" data-i18n-title="Close">x</button>
    </div>
  </div>

  <div id="addressbar">
    <div class="nav">
      <button class="icon nav-btn" data-nav="back" title="Back" data-i18n-title="Back">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
      </button>
      <button class="icon nav-btn" data-nav="forward" title="Forward" data-i18n-title="Forward">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>
      </button>
      <button class="icon nav-btn" data-nav="reload" title="Reload" data-i18n-title="Reload">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 10a5 5 0 1 1-1.6-3.7"/><path d="M15 4v3.2h-3.2"/></svg>
      </button>
      <button class="icon nav-btn" id="reopen" title="Reopen closed tab" data-i18n-title="Reopen closed tab">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10a6 6 0 1 1 6 6"/><path d="M4 6v4h4"/></svg>
      </button>
    </div>

    <div id="url-wrap">
      <img id="url-icon" alt="" hidden />
      <input id="url" spellcheck="false" placeholder="Search or enter address"
             data-i18n-placeholder="Search or enter address" />
      <div id="url-actions" class="url-actions"></div>
    </div>

    <div id="progress" aria-hidden="true"></div>
    <button class="pill" id="download" title="Open downloads folder"
            data-i18n-title="Open downloads folder" hidden></button>
    <div id="toolbar" class="toolbar"></div>
    <button class="icon" id="theme-btn" title="Menu" data-i18n-title="Menu">=</button>
  </div>

  <div id="bookmarks" class="bookmarks" hidden></div>

  <div class="resize top" data-resize="n"></div>
  <div class="resize left-top" data-resize="nw"></div>
  <div class="resize right-top" data-resize="ne"></div>
  <div class="resize left" data-resize="w"></div>
  <div class="resize right" data-resize="e"></div>

  <div id="toast" class="toast" hidden></div>

  <div id="ctx-menu" class="ctx-menu" hidden></div>

  <script type="module" src="i18n.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
