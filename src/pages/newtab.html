<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>New tab</title>
  <link rel="stylesheet" href="../pages.css" />
  <style>
    body { display: block; }
    main { max-width: 760px; margin: 0 auto; padding: 12vh 24px 24px; }
    .search { display: flex; gap: 10px; margin-bottom: 28px; }
    .search input {
      flex: 1;
      height: 44px;
      padding: 0 16px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      font-size: 15px;
      outline: none;
    }
    .search input:focus { border-color: var(--accent); }
    .search button {
      height: 44px;
      padding: 0 20px;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 22px;
      font: inherit;
    }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
    .tile {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      padding: 14px 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: default;
    }
    .tile:hover { background: var(--hover); }
    .tile .dot {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent);
      color: #111;
      font-weight: 600;
    }
    .tile .name {
      max-width: 100%;
      overflow: hidden;
      color: var(--dim);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    h1 { margin: 0 0 22px; font-size: 22px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1 id="greeting">New tab</h1>
    <div class="search">
      <input id="q" placeholder="Search or enter address" autocomplete="off" />
      <button id="go">Go</button>
    </div>
    <div class="tiles" id="tiles"></div>
  </main>
  <script type="module" src="./newtab.js"></script>
</body>
</html>
