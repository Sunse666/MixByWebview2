<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Super drag self test</title>
  <style>
    body { background:#17181a; color:#e8eaed; font:14px system-ui, sans-serif; padding:24px; }
    .row { display:flex; gap:12px; padding:6px 0; border-bottom:1px solid #2f3133; }
    .name { width:220px; color:#9aa0a6; }
    .ok { color:#7bd88f; }
    .bad { color:#f28b82; }
    a, #card { color:#8ab4f8; }
    #card { cursor:pointer; border:1px solid #444; padding:12px; margin:10px 0; }
  </style>
</head>
<body>
  <h2>Super drag self test</h2>
  <p><a id="sample" href="https://example.com/sample">sample link</a></p>
  <div id="card">card style element (no href)</div>
  <div id="out"></div>
  <script>
    (function () {
      var out = document.getElementById("out");

      function line(label, value, ok) {
        var row = document.createElement("div");
        row.className = "row";
        var name = document.createElement("span");
        name.className = "name";
        name.textContent = label;
        var shown = document.createElement("span");
        shown.textContent = String(value);
        if (ok === true) shown.className = "ok";
        if (ok === false) shown.className = "bad";
        row.append(name, shown);
        out.append(row);
      }

      function fire(target, type, x, y) {
        target.dispatchEvent(
          new PointerEvent(type, {
            bubbles: true, cancelable: true, button: 0, buttons: 1,
            pointerId: 1, pointerType: "mouse", clientX: x, clientY: y,
          }),
        );
      }

      function dragOn(element) {
        var box = element.getBoundingClientRect();
        var x = box.left + 6;
        var y = box.top + 6;
        fire(element, "pointerdown", x, y);
        fire(window, "pointermove", x + 60, y);
        fire(window, "pointermove", x + 200, y);
        fire(window, "pointerup", x + 200, y);
      }

      line("engine installed", String(window.__mixSuperDragEngine), !!window.__mixSuperDragEngine);
      line("switch on", String(window.__mixSuperDrag), window.__mixSuperDrag !== false);
      var cfg = window.__mixDragConfig || {};
      line("threshold", cfg.threshold || "missing", !!cfg.threshold);
      line("map", JSON.stringify(cfg.map || null), !!cfg.map);

      var calls = [];
      var bridge = window.__TAURI_INTERNALS__;
      line("bridge", bridge ? "present" : "missing", !!bridge);
      if (bridge && bridge.invoke) {
        var original = bridge.invoke.bind(bridge);
        bridge.invoke = function (command, args) {
          if (command !== "ui_log") {
            calls.push(command);
          }
          return original(command, args);
        };
      }

      setTimeout(function () {
        calls.length = 0;
        dragOn(document.getElementById("sample"));
        line("drag on link", calls.length ? calls.join(", ") : "no command", calls.length > 0);

        calls.length = 0;
        dragOn(document.getElementById("card"));
        line("drag on card", calls.length ? calls.join(", ") : "no command", calls.length > 0);
      }, 500);
    })();
  </script>
</body>
</html>
