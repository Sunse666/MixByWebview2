<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Source</title>
  <link rel="stylesheet" href="../pages.css" />
  <style>
    /* The markup is the point, so it gets the whole window and wraps rather than
       scrolling sideways: long attribute values are common and a horizontal scrollbar
       hides most of them. */
    body { margin: 0; }
    pre {
      margin: 0;
      padding: 16px 20px;
      white-space: pre-wrap;
      word-break: break-word;
      font: 13px/1.55 Consolas, ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <pre id="code"></pre>
  <script type="module" src="source.js"></script>
</body>
</html>
