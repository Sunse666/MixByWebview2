<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mix theme</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <section class="menu" id="menu" hidden></section>

  <section class="menu" id="app-menu" hidden></section>

  <section class="panel" id="permission-panel" hidden>
    <header><strong data-i18n="Permission">Permission</strong></header>
    <p id="permission-text" class="question"></p>
    <footer>
      <button id="permission-block" data-i18n="Block">Block</button>
      <button id="permission-allow" class="primary" data-i18n="Allow">Allow</button>
    </footer>
  </section>

  <section class="panel" id="theme-panel" hidden>
    <header class="panel-head">
      <div class="head-left">
        <button class="back" id="panel-back" title="Back" data-i18n-title="Back">‹</button>
        <h1 id="panel-title">Appearance</h1>
      </div>
      <div class="presets" id="presets">
        <button data-preset="green" data-i18n="Green">Green</button>
        <button data-preset="dark" data-i18n="Dark">Dark</button>
        <button data-preset="light" data-i18n="Light">Light</button>
      </div>
    </header>

    <div data-section="appearance">
      <h2 data-i18n="Colors">Colors</h2>
      <div class="color-grid">
        <label><span data-i18n="Background">Background</span><input type="color" id="bg" /></label>
        <label><span data-i18n="Toolbar">Toolbar</span><input type="color" id="chrome" /></label>
        <label><span data-i18n="Active tab">Active tab</span><input type="color" id="tab" /></label>
        <label><span data-i18n="Tab text">Tab text</span><input type="color" id="tab-text" /></label>
        <label><span data-i18n="Text">Text</span><input type="color" id="text" /></label>
        <label><span data-i18n="Accent">Accent</span><input type="color" id="accent" /></label>
        <label><span data-i18n="Address bar">Address bar</span><input type="color" id="url-bg" /></label>
        <label><span data-i18n="Hover">Hover</span><input type="color" id="hover" /></label>
        <label><span data-i18n="Border">Border</span><input type="color" id="border" /></label>
      </div>

      <h2 data-i18n="Shape">Shape</h2>
      <label class="slider"><span data-i18n="Panel radius">Panel radius</span> <input type="range" id="radius" min="0" max="32" step="1" /><output id="radius-out"></output></label>
      <label class="slider"><span data-i18n="Tab radius">Tab radius</span> <input type="range" id="tab-radius" min="0" max="20" step="1" /><output id="tab-radius-out"></output></label>

      <h2 data-i18n="Type">Type</h2>
      <label class="slider"><span data-i18n="Font size">Font size</span> <input type="range" id="font-size" min="10" max="20" step="1" /><output id="font-out"></output></label>
      <label class="text"><span data-i18n="Font">Font</span> <input type="text" id="font-family" list="font-list" placeholder="Segoe UI" />
        <datalist id="font-list">
          <option value="Segoe UI, system-ui, sans-serif"></option>
          <option value="Microsoft YaHei UI, sans-serif"></option>
          <option value="Consolas, monospace"></option>
          <option value="Georgia, serif"></option>
        </datalist>
      </label>
    </div>

    <div data-section="startup" hidden>
      <h2 data-i18n="Startup">Startup</h2>
      <label class="toggle"><input type="checkbox" id="autostart" /> <span data-i18n="Start Mix when the system starts">Start Mix when the system starts</span></label>
      <label class="toggle"><input type="checkbox" id="restore" /> <span data-i18n="Restore windows on launch">Restore windows on launch</span></label>
    </div>

    <div data-section="theme" hidden>
      <h2 data-i18n="Theme file">Theme file</h2>
      <p class="hint-text" data-i18n="Paste a theme.json below, or export the current one.">Paste a theme.json below, or export the current one.</p>
      <textarea id="theme-json" spellcheck="false" placeholder="{ &quot;colors&quot;: { ... } }"></textarea>
      <p id="theme-error" class="error"></p>
      <div class="row-actions">
        <button id="theme-export" data-i18n="Export">Export</button>
        <button id="theme-apply-json" data-i18n="Apply JSON">Apply JSON</button>
      </div>
    </div>

    <footer class="panel-foot">
      <button id="cancel" data-i18n="Cancel">Cancel</button>
      <button id="save" class="primary" data-i18n="Save">Save</button>
    </footer>
  </section>

  <script type="module" src="i18n.js"></script>
  <script type="module" src="overlay.js"></script>
</body>
</html>
